[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-doctor"
version = "0.1.0"
description = "Find env vars that are documented, configured, or read by nobody."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["configuration", "dotenv", "drift", "devops", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/env-doctor"

[project.scripts]
env-doctor = "envdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["envdoctor*"]
